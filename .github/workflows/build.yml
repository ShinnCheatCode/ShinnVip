name: Build IPA from Source.zip

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Source.zip"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Source.zip"
      - ".github/workflows/build.yml"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Runner information
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "SHINNCHEAT IPA BUILD"
          echo "========================================"
          echo "Runner:"
          uname -a
          echo ""
          echo "macOS:"
          sw_vers
          echo ""
          echo "Xcode:"
          xcodebuild -version
          echo ""
          echo "Xcode path:"
          xcode-select -p

      - name: 3. Check Source.zip
        shell: bash
        run: |
          set -e

          echo "Checking Source.zip..."

          if [ ! -f "Source.zip" ]; then
            echo "::error::Source.zip not found in repository root."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Source.zip found:"
          ls -lh Source.zip

      - name: 4. Extract Source.zip
        shell: bash
        run: |
          set -e

          rm -rf source
          rm -rf build
          rm -rf ipa

          mkdir -p source
          mkdir -p build
          mkdir -p ipa/Payload

          unzip -q Source.zip -d source

          echo "Source extracted."
          echo ""
          echo "Xcode projects:"
          find source \
            -type d \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: 5. Find Xcode project
        id: xcode
        shell: bash
        run: |
          set -e

          WORKSPACE=$(find source \
            -type d \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print | sort | head -n 1)

          PROJECT=$(find source \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -print | sort | head -n 1)

          if [ -n "$WORKSPACE" ]; then

            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"

            echo "Workspace:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

            echo "Project:"
            echo "$PROJECT"

          else

            echo "::error::No Xcode project or workspace found."

            find source -maxdepth 8 -print

            exit 1

          fi

      - name: 6. List schemes
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "AVAILABLE SCHEMES"
          echo "========================================"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -list

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -list

          fi

      - name: 7. Detect scheme
        id: scheme
        shell: bash
        run: |
          set -e

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            LIST=$(xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -list 2>/dev/null)

          else

            LIST=$(xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -list 2>/dev/null)

          fi

          echo "$LIST"

          SCHEME=""

          # Ưu tiên scheme của app hiện tại
          for NAME in \
            "ThreeOneOSFive" \
            "ShinnCheat" \
            "ShinnCheatApp"
          do

            if echo "$LIST" | grep -Fxq "    $NAME"; then
              SCHEME="$NAME"
              break
            fi

          done

          # Nếu không có thì lấy scheme đầu tiên
          if [ -z "$SCHEME" ]; then

            SCHEME=$(
              echo "$LIST" |
              awk '
                /^Schemes:/ {
                  found=1
                  next
                }

                found && /^[[:space:]]+[A-Za-z0-9_.-]+$/ {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  print
                  exit
                }
              '
            )

          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::No scheme found."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Selected scheme:"
          echo "$SCHEME"

      - name: 8. Build archive
        shell: bash
        run: |
          set -o pipefail

          ARCHIVE="$GITHUB_WORKSPACE/build/ShinnCheat.xcarchive"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          echo "========================================"
          echo "BUILD ARCHIVE"
          echo "========================================"

          echo "Scheme: $SCHEME"
          echo "Archive: $ARCHIVE"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          fi

      - name: 9. Verify archive
        shell: bash
        run: |
          set -e

          ARCHIVE="build/ShinnCheat.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "::error::Archive was not created."
            tail -200 build.log || true
            exit 1
          fi

          APP=$(find \
            "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::No .app found."
            find "$ARCHIVE" -maxdepth 7 -print
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Archive:"
          echo "$ARCHIVE"

          echo "Application:"
          echo "$APP"

      - name: 10. App information
        shell: bash
        run: |
          set -e

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist" || true

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist" || true

          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist" || true

      - name: 11. Create Payload
        shell: bash
        run: |
          set -e

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP" ipa/Payload/

          echo "Payload created."

      - name: 12. Create IPA
        shell: bash
        run: |
          set -e

          cd ipa

          zip -qry \
            "../ShinnCheat-unsigned.ipa" \
            Payload

          cd ..

          if [ ! -f "ShinnCheat-unsigned.ipa" ]; then
            echo "::error::IPA was not created."
            exit 1
          fi

          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh ShinnCheat-unsigned.ipa

      - name: 13. Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat-unsigned.ipa
          if-no-files-found: error

      - name: 14. Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-XCArchive
          path: build/ShinnCheat.xcarchive
          if-no-files-found: error

      - name: 15. Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: build.log
          if-no-files-found: ignore