# FILE: .github/workflows/build.yml

name: Build Shinn IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Show repo files
        run: |
          ls -lah
          echo "ZIP LIST:"
          find . -maxdepth 2 -iname "*.zip" -print

      - name: Extract shinn.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 \( -iname "shinn.zip" -o -iname "Shinn.zip" \) | head -1)

          if [ -z "${ZIP:-}" ]; then
            echo "❌ Không tìm thấy shinn.zip ở root repo"
            echo "Hãy commit file shinn.zip vào thư mục gốc repo."
            exit 1
          fi

          echo "Found zip: $ZIP"

          SRC="$RUNNER_TEMP/source"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          unzip -q -o "$ZIP" -d "$SRC"

          echo "SOURCE TREE (maxdepth 4):"
          find "$SRC" -maxdepth 4 | head -200

          WORKSPACE=$(find "$SRC" -name "*.xcworkspace" ! -path "*.xcodeproj/*" | head -1 || true)
          PROJECT=$(find "$SRC" -name "*.xcodeproj" | head -1 || true)

          if [ -z "${PROJECT:-}" ] && [ -z "${WORKSPACE:-}" ]; then
            echo "❌ Không tìm thấy .xcodeproj hoặc .xcworkspace trong shinn.zip"
            exit 1
          fi

          if [ -n "${WORKSPACE:-}" ]; then
            ROOT=$(dirname "$WORKSPACE")
            echo "USE_WORKSPACE=1" >> "$GITHUB_ENV"
            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
            echo "PROJECT=${PROJECT:-}" >> "$GITHUB_ENV"
          else
            ROOT=$(dirname "$PROJECT")
            echo "USE_WORKSPACE=0" >> "$GITHUB_ENV"
            echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Root: $ROOT"
          echo "Workspace: ${WORKSPACE:-none}"
          echo "Project: ${PROJECT:-none}"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Detect scheme
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"

          if [ "${USE_WORKSPACE}" = "1" ]; then
            LIST=$(xcodebuild -list -workspace "$(basename "$WORKSPACE")")
          else
            LIST=$(xcodebuild -list -project "$(basename "$PROJECT")")
          fi

          echo "$LIST"

          SCHEME=$(echo "$LIST" | awk '
            /Schemes:/ {s=1; next}
            s && NF {gsub(/^[ \t]+|[ \t]+$/, "", $0); print; exit}
          ')

          PREFERRED=$(echo "$LIST" | awk '
            /Schemes:/ {s=1; next}
            s && NF {
              gsub(/^[ \t]+|[ \t]+$/, "", $0)
              if (tolower($0) ~ /shinn/ || $0 == "3105") { print; exit }
            }
          ')

          if [ -n "${PREFERRED:-}" ]; then
            SCHEME="$PREFERRED"
          fi

          if [ -z "${SCHEME:-}" ]; then
            echo "❌ Không detect được scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Detected scheme: $SCHEME"

      - name: Archive unsigned
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"

          ARCHIVE="$RUNNER_TEMP/Shinn.xcarchive"
          rm -rf "$ARCHIVE"

          COMMON=(
            -scheme "$SCHEME"
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$ARCHIVE"
            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            DEVELOPMENT_TEAM=""
            -allowProvisioningUpdates=NO
          )

          if [ "${USE_WORKSPACE}" = "1" ]; then
            xcodebuild archive -workspace "$(basename "$WORKSPACE")" "${COMMON[@]}" | tee "$RUNNER_TEMP/build.log"
          else
            xcodebuild archive -project "$(basename "$PROJECT")" "${COMMON[@]}" | tee "$RUNNER_TEMP/build.log"
          fi

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)
          if [ -z "${APP:-}" ]; then
            echo "❌ Không tìm thấy .app trong archive"
            find "$ARCHIVE" | head -100
            exit 1
          fi

          echo "APP=$APP"
          ls -lah "$APP"

          PKG="$RUNNER_TEMP/ipa"
          rm -rf "$PKG"
          mkdir -p "$PKG/Payload"
          cp -R "$APP" "$PKG/Payload/"

          cd "$PKG"
          zip -qry "$GITHUB_WORKSPACE/Shinn.ipa" Payload
          ls -lah "$GITHUB_WORKSPACE/Shinn.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shinn-IPA
          path: Shinn.ipa
          if-no-files-found: error

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore