name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip -q Source.zip
          ls -la Source/
          ls Source/ThreeOneOSFive.xcodeproj/

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: List schemes
        run: |
          cd Source
          xcodebuild -list -project ThreeOneOSFive.xcodeproj || true

      - name: Build (Release, unsigned)
        run: |
          cd Source
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find Source/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy .app"
            find Source/build -type d 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "✅ Found: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr KaitoCheat.ipa Payload
          ls -lh KaitoCheat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KaitoCheat-IPA
          path: KaitoCheat.ipa
          retention-days: 14