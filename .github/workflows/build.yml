name: Build IPA from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA from ZIP
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "❌ Không tìm thấy file .zip"
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir -p src
          unzip -o "$ZIP" -d src
          PROJECT=$(find src -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "Project root: $PROJECT"
          shopt -s dotglob
          cp -R "$PROJECT"/* .
          ls -la
          test -f pubspec.yaml || { echo "❌ Không tìm thấy pubspec.yaml"; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Generate iOS host project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shinn_flutter_template
          flutter create \
            --platforms=ios \
            --org com.shinn \
            --project-name shinn_manager \
            --ios-language swift \
            /tmp/shinn_flutter_template
          rm -rf ios
          cp -R /tmp/shinn_flutter_template/ios ios

      - name: Configure iOS + disable ALL code signing
        shell: bash
        run: |
          set -euo pipefail
          P="ios/Runner/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ShinnManager" "$P" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ShinnManager" "$P"

          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription Xác thực để mở ShinnManager" "$P" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string Xác thực để mở ShinnManager" "$P"

          # iOS 17+
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' ios/Runner.xcodeproj/project.pbxproj

          # === Tắt signing triệt để trên project.pbxproj ===
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBX"

          # Thêm flag vào mọi buildSettings
          python3 - << 'PY'
          import re
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path) as f:
              content = f.read()
          # Thêm vào mọi block buildSettings
          content = re.sub(
              r'(buildSettings = \{)',
              r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n\t\t\t\tDEVELOPMENT_TEAM = "";',
              content
          )
          with open(path, "w") as f:
              f.write(content)
          print("pbxproj patched")
          PY

          # === Tắt signing trong Podfile ===
          cat >> ios/Podfile << 'EOF'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
              end
            end
          end
          EOF

          echo "Code signing fully disabled"

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build iOS (config only then xcodebuild)
        shell: bash
        run: |
          set -euo pipefail
          # Tạo config
          flutter build ios --release --no-codesign --config-only

          # Build bằng xcodebuild, tắt signing hoàn toàn
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy Runner.app"
            find build -type d -name "*.app" || true
            ls -la build/ios/ || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          rm -rf Payload ShinnManager.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ShinnManager.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ShinnManager.ipa
          shasum -a 256 ShinnManager.ipa | tee ShinnManager.ipa.sha256
          ls -lh ShinnManager.ipa
          file ShinnManager.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnManager-ipa
          path: |
            ShinnManager.ipa
            ShinnManager.ipa.sha256
          if-no-files-found: error
          retention-days: 14