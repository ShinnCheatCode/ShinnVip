name: Build ShinnManager IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Check project
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "Current directory:"
            pwd
            echo "Files:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Flutter project found."

      - name: Prepare Flutter project
        run: |
          if [ ! -d "ios" ]; then
            echo "ios folder not found."
            echo "Creating iOS platform..."

            flutter create \
              --platforms=ios \
              --project-name=shinn_manager \
              --org=com.shinn.shinnmanager \
              .

          else
            echo "ios folder already exists."
          fi

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create IPA
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            build/ipa/Payload/Runner.app

          cd build/ipa
          zip -r ../ShinnManager.ipa Payload

          cd ../..

          echo "IPA created:"
          ls -lh build/ShinnManager.ipa

      - name: SHA256
        run: |
          shasum -a 256 \
            build/ShinnManager.ipa \
            > build/ShinnManager.ipa.sha256

          cat build/ShinnManager.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnManager-IPA
          path: |
            build/ShinnManager.ipa
            build/ShinnManager.ipa.sha256
          if-no-files-found: error
          retention-days: 30