name: Build ShinnCheat IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Source.zip"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: shinncheat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Source.zip
        shell: bash
        run: |
          set -e
          test -f Source.zip
          echo "Source.zip found"
          ls -lh Source.zip

      - name: Extract Source
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir -p source
          unzip -q Source.zip -d source

          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate Xcode project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT=$(find source -name "*.xcodeproj" -type d | head -1)
          WORKSPACE=$(find source -name "*.xcworkspace" -type d | head -1)

          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Using project: $PROJECT"
          else
            echo "ERROR: No Xcode project/workspace found"
            exit 1
          fi

      - name: Verify ShinnCheat project
        shell: bash
        run: |
          set -e

          PROJECT="source/Source/ThreeOneOSFive.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Expected project not found:"
            echo "$PROJECT"
            exit 1
          fi

          echo "Project verified:"
          echo "$PROJECT"

          grep -n 'PBXNativeTarget' "$PROJECT/project.pbxproj" || true
          grep -n 'productName = 3105' "$PROJECT/project.pbxproj" || true

      - name: Xcode information
        shell: bash
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Show schemes
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "source/Source/ThreeOneOSFive.xcodeproj" \
            -list

      - name: Validate project
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project "source/Source/ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee project-build.log

      - name: Archive
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project "source/Source/ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ShinnCheat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            | tee build/archive.log

      - name: Check archive
        shell: bash
        run: |
          set -e

          ARCHIVE="build/ShinnCheat.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive was not created"
            exit 1
          fi

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find "$ARCHIVE" -maxdepth 5 -print
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Application found:"
          echo "$APP"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            ShinnCheat.ipa

          echo "IPA created:"
          ls -lh ShinnCheat.ipa

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          unzip -l build/ShinnCheat.ipa | head -50

          test -f build/ShinnCheat.ipa

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: build/ShinnCheat.ipa
          if-no-files-found: warn

      - name: Upload XCArchive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-XCArchive
          path: build/ShinnCheat.xcarchive
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Logs
          path: |
            project-build.log
            build/archive.log
          if-no-files-found: warn