name: Build ShinnCheat IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          echo "Workspace:"
          pwd
          find . -maxdepth 3 -type f | sort | head -200

      - name: Check Source.zip
        run: |
          if [ ! -f "Source.zip" ]; then
            echo "::error::Source.zip not found in repository root."
            exit 1
          fi

          echo "Source.zip found:"
          ls -lh Source.zip

      - name: Extract Source.zip
        run: |
          rm -rf build_source
          mkdir -p build_source

          unzip -q Source.zip -d build_source

          echo "Extracted files:"
          find build_source -maxdepth 5 -type f | sort | head -300

      - name: Locate Xcode project
        id: locate
        shell: bash
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/build_source" \
            -name "*.xcodeproj" \
            -type d \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::No .xcodeproj found inside Source.zip"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"
          PROJECT_NAME="$(basename "$PROJECT")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

          echo "Project:"
          echo "$PROJECT"

      - name: Locate ShinnCompleteUI.swift
        run: |
          FILE=$(find "$GITHUB_WORKSPACE/build_source" \
            -name "ShinnCompleteUI.swift" \
            -type f \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "::warning::ShinnCompleteUI.swift was not found."
          else
            echo "Found:"
            echo "$FILE"
          fi

      - name: Show Xcode schemes
        id: schemes
        shell: bash
        run: |
          PROJECT="${{ steps.locate.outputs.project }}"

          echo "Available schemes:"
          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          PROJECT="${{ steps.locate.outputs.project }}"

          SCHEME=$(
            xcodebuild -project "$PROJECT" -list |
            awk '
              /Schemes:/ { found=1; next }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "", $0)
                print
                exit
              }
            '
          )

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Clean
        run: |
          PROJECT="${{ steps.locate.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            clean

      - name: Build archive
        id: archive
        shell: bash
        run: |
          set -o pipefail

          PROJECT="${{ steps.locate.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/ShinnCheat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee "$GITHUB_WORKSPACE/build/build.log"

      - name: Find built app
        id: app
        shell: bash
        run: |
          APP=$(find \
            "$GITHUB_WORKSPACE/build/ShinnCheat.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::No .app found in archive."
            echo "Archive contents:"
            find "$GITHUB_WORKSPACE/build/ShinnCheat.xcarchive" -maxdepth 5 -print
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Built app:"
          echo "$APP"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          rm -rf "$GITHUB_WORKSPACE/build/Payload"
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"

          cp -R "$APP" "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"

          zip -qry ShinnCheat.ipa Payload

          echo "IPA created:"
          ls -lh ShinnCheat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: build/ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-XCArchive
          path: build/ShinnCheat.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## ShinnCheat Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: macOS 14" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: ${{ steps.locate.outputs.project_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheme: ${{ steps.scheme.outputs.scheme }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: build/ShinnCheat.xcarchive" >> "$GITHUB_STEP_SUMMARY"
          echo "- IPA: build/ShinnCheat.ipa" >> "$GITHUB_STEP_SUMMARY"