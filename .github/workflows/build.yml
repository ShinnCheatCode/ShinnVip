name: Build IPA from Source.zip

on:
  workflow_dispatch:

  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - "Source.zip"
      - ".github/workflows/build.yml"

# Chỉ giữ lại build mới nhất.
# Nếu có build cũ đang queued hoặc đang chạy,
# build mới sẽ tự hủy build cũ.
concurrency:
  group: build-ipa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

