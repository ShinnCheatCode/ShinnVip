name: Build IPA from Source.zip

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. KIỂM TRA Source.zip
      # ============================================================
      - name: Check Source.zip
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CHECK Source.zip"
          echo "========================================"

          if [ ! -f "Source.zip" ]; then
            echo "❌ Không tìm thấy Source.zip"
            echo ""
            echo "Các file hiện có:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "✅ Tìm thấy Source.zip"
          ls -lh "Source.zip"

      # ============================================================
      # 3. GIẢI NÉN SOURCE
      # ============================================================
      - name: Extract Source.zip
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        EXTRACT SOURCE"
          echo "========================================"

          rm -rf source
          mkdir -p source

          unzip -q "Source.zip" -d source

          echo ""
          echo "✅ Giải nén thành công"
          echo ""

          echo "Danh sách file:"
          find source -maxdepth 5 -type f | head -300

      # ============================================================
      # 4. TÌM XCODE PROJECT / WORKSPACE
      # ============================================================
      - name: Find Xcode project
        id: xcode
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        FIND XCODE PROJECT"
          echo "========================================"

          WORKSPACE=$(find source \
            -type d \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)

          PROJECT=$(find source \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -print -quit)

          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"

            echo "✅ Tìm thấy Workspace:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then
            echo "workspace=" >> "$GITHUB_OUTPUT"
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

            echo "✅ Tìm thấy Project:"
            echo "$PROJECT"

          else
            echo "❌ Không tìm thấy .xcodeproj hoặc .xcworkspace"
            echo ""
            echo "Cấu trúc source:"
            find source -maxdepth 8 -print

            exit 1
          fi

      # ============================================================
      # 5. THÔNG TIN XCODE
      # ============================================================
      - name: Xcode information
        run: |
          echo "========================================"
          echo "        XCODE INFORMATION"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Xcode path:"
          xcode-select -p

      # ============================================================
      # 6. LIỆT KÊ SCHEME
      # ============================================================
      - name: List schemes
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "        AVAILABLE SCHEMES"
          echo "========================================"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -list

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -list

          fi

      # ============================================================
      # 7. TỰ ĐỘNG CHỌN SCHEME
      # ============================================================
      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        DETECT SCHEME"
          echo "========================================"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            SCHEME=$(
              xcodebuild \
                -workspace "${{ steps.xcode.outputs.workspace }}" \
                -list 2>/dev/null |
              awk '
                /Schemes:/ {
                  found=1
                  next
                }

                found && NF {
                  gsub(/^[ \t]+|[ \t]+$/, "")
                  print
                  exit
                }
              '
            )

          else

            SCHEME=$(
              xcodebuild \
                -project "${{ steps.xcode.outputs.project }}" \
                -list 2>/dev/null |
              awk '
                /Schemes:/ {
                  found=1
                  next
                }

                found && NF {
                  gsub(/^[ \t]+|[ \t]+$/, "")
                  print
                  exit
                }
              '
            )

          fi

          if [ -z "$SCHEME" ]; then
            echo "❌ Không tìm thấy Scheme."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "✅ Scheme được chọn:"
          echo "$SCHEME"

      # ============================================================
      # 8. CLEAN BUILD
      # ============================================================
      - name: Clean build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CLEAN BUILD"
          echo "========================================"

          rm -rf build
          mkdir -p build

      # ============================================================
      # 9. BUILD ARCHIVE
      # ============================================================
      - name: Build archive
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "        BUILD ARCHIVE"
          echo "========================================"

          SCHEME="${{ steps.scheme.outputs.scheme }}"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$PWD/build/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              | tee build.log

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$PWD/build/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              | tee build.log

          fi

      # ============================================================
      # 10. KIỂM TRA ARCHIVE
      # ============================================================
      - name: Check archive
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CHECK ARCHIVE"
          echo "========================================"

          if [ ! -d "build/App.xcarchive" ]; then
            echo "❌ Archive không được tạo."

            echo ""
            echo "===== BUILD LOG ====="
            cat build.log || true

            exit 1
          fi

          echo "✅ Archive đã được tạo."

          echo ""
          echo "Applications:"
          find build/App.xcarchive/Products \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            -print

      # ============================================================
      # 11. TÌM APP
      # ============================================================
      - name: Find built app
        id: app
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        FIND APP"
          echo "========================================"

          APP=$(find \
            build/App.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "❌ Không tìm thấy .app"

            find build/App.xcarchive \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"

          echo "✅ APP:"
          echo "$APP"

      # ============================================================
      # 12. KIỂM TRA INFO APP
      # ============================================================
      - name: Show app information
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          echo "========================================"
          echo "        APP INFORMATION"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist" || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist" || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist" || true

      # ============================================================
      # 13. TẠO PAYLOAD
      # ============================================================
      - name: Create Payload
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CREATE PAYLOAD"
          echo "========================================"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            "${{ steps.app.outputs.app }}" \
            ipa/Payload/

          echo "✅ Payload created"

      # ============================================================
      # 14. TẠO IPA
      # ============================================================
      - name: Create IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CREATE IPA"
          echo "========================================"

          cd ipa

          zip -qry \
            "../ShinnCheat-unsigned.ipa" \
            Payload

          cd ..

          if [ ! -f "ShinnCheat-unsigned.ipa" ]; then
            echo "❌ Không tạo được IPA."
            exit 1
          fi

          echo ""
          echo "✅ IPA CREATED"
          ls -lh ShinnCheat-unsigned.ipa

      # ============================================================
      # 15. UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat-unsigned.ipa
          if-no-files-found: error

      # ============================================================
      # 16. UPLOAD ARCHIVE
      # ============================================================
      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-XCArchive
          path: build/App.xcarchive
          if-no-files-found: error

      # ============================================================
      # 17. UPLOAD BUILD LOG NẾU CÓ LỖI
      # ============================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: |
            build.log
            source/**/*.log
          if-no-files-found: ignore