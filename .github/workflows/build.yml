name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip -q Source.zip
          ls -la Source/
          ls -la Source/ThreeOneOSFive.xcodeproj/ || true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create scheme (nếu thiếu)
        run: |
          cd Source
          mkdir -p ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes

          cat > ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/3105.xcscheme << 'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1540"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "3105"
                         BuildableName = "3105.app"
                         BlueprintName = "3105"
                         ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES"
                shouldAutocreateTestPlan = "YES">
             </TestAction>
             <LaunchAction
                buildConfiguration = "Release"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "3105"
                      BuildableName = "3105.app"
                      BlueprintName = "3105"
                      ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "3105"
                      BuildableName = "3105.app"
                      BlueprintName = "3105"
                      ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          SCHEME

          echo "✅ Scheme 3105 đã tạo"
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build (Release, unsigned)
        run: |
          cd Source
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find Source/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy .app"
            find Source/build -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "✅ Found: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Đổi tên app thành KaitoCheat.app cho đẹp
          if [ -d Payload/3105.app ]; then
            mv Payload/3105.app Payload/KaitoCheat.app
          fi
          zip -qr KaitoCheat.ipa Payload
          ls -lh KaitoCheat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KaitoCheat-IPA
          path: KaitoCheat.ipa
          retention-days: 14