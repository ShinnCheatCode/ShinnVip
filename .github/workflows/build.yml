name: Build ShinnManager IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shinnmanager-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 35

    defaults:
      run:
        working-directory: ShinnManager   # ← quan trọng

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Generate iOS host project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shinn_flutter_template
          flutter create \
            --platforms=ios \
            --org com.shinn \
            --project-name shinn_manager \
            --ios-language swift \
            /tmp/shinn_flutter_template
          rm -rf ios
          cp -R /tmp/shinn_flutter_template/ios ios

      - name: Configure iOS
        shell: bash
        run: |
          set -euo pipefail
          P="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ShinnManager" "$P" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ShinnManager" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string Xac thuc de mo ShinnManager" "$P" || \
            /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription Xac thuc de mo ShinnManager" "$P"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos

      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload ShinnManager.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/ShinnManager.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ShinnManager.ipa
          shasum -a 256 ShinnManager.ipa | tee ShinnManager.ipa.sha256
          ls -lh ShinnManager.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnManager-ipa
          path: |
            ShinnManager/ShinnManager.ipa
            ShinnManager/ShinnManager.ipa.sha256
          if-no-files-found: error
          retention-days: 14