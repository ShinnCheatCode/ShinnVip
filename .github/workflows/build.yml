name: Build Source

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-source:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      # =========================
      # CHECKOUT SOURCE
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # SHOW SOURCE
      # =========================
      - name: Check source
        run: |
          set -euo pipefail

          echo "===== Repository ====="
          pwd

          echo "===== Files ====="
          find . \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -print \
            | head -200

      # =========================
      # CREATE SOURCE.ZIP
      # =========================
      - name: Build Source.zip
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          echo "Creating Source.zip..."

          zip -r "dist/Source.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "*.DS_Store"

          echo "===== Source.zip created ====="
          ls -lh "dist/Source.zip"

      # =========================
      # VERIFY ZIP
      # =========================
      - name: Verify Source.zip
        run: |
          set -euo pipefail

          if [ ! -f "dist/Source.zip" ]; then
            echo "::error::Không tạo được Source.zip"
            exit 1
          fi

          echo "===== ZIP CONTENT ====="
          unzip -l "dist/Source.zip" | head -100

          echo "===== ZIP SIZE ====="
          du -h "dist/Source.zip"

      # =========================
      # UPLOAD ARTIFACT
      # =========================
      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: Source
          path: dist/Source.zip
          if-no-files-found: error
          retention-days: 7