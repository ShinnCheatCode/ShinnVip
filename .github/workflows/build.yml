name: Build IPA from Source.zip

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. CHECK SOURCE.ZIP
      # =========================================================

      - name: Check Source.zip
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECK SOURCE.ZIP"
          echo "========================================"

          if [ ! -f "Source.zip" ]; then
            echo "::error::Source.zip was not found in repository root."

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print | sort

            exit 1
          fi

          echo "Source.zip found:"
          ls -lh Source.zip


      # =========================================================
      # 3. EXTRACT SOURCE
      # =========================================================

      - name: Extract Source.zip
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "EXTRACT SOURCE"
          echo "========================================"

          rm -rf source
          mkdir -p source

          unzip -q Source.zip -d source

          echo ""
          echo "Extracted source:"
          find source -maxdepth 5 -type f -print | sort | head -500


      # =========================================================
      # 4. FIND XCODE PROJECT / WORKSPACE
      # =========================================================

      - name: Find Xcode project
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FIND XCODE PROJECT"
          echo "========================================"

          WORKSPACE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name "*.xcworkspace" \
              -not -path "*/Pods/*" \
              -print |
            head -n 1
          )"

          PROJECT="$(
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name "*.xcodeproj" \
              -not -path "*/Pods/*" \
              -print |
            head -n 1
          )"

          if [ -n "$WORKSPACE" ]; then

            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"

            echo "Workspace found:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

            echo "Project found:"
            echo "$PROJECT"

          else

            echo "::error::No Xcode project or workspace found."

            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 8 \
              -print

            exit 1

          fi


      # =========================================================
      # 5. XCODE VERSION
      # =========================================================

      - name: Xcode information
        shell: bash
        run: |
          echo "========================================"
          echo "XCODE INFORMATION"
          echo "========================================"

          xcodebuild -version

          echo ""

          xcode-select -p


      # =========================================================
      # 6. LIST SCHEMES
      # =========================================================

      - name: List schemes
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "AVAILABLE SCHEMES"
          echo "========================================"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -list

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -list

          fi


      # =========================================================
      # 7. DETECT SCHEME
      # =========================================================

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DETECT SCHEME"
          echo "========================================"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            LIST="$(
              xcodebuild \
                -workspace "${{ steps.xcode.outputs.path }}" \
                -list 2>/dev/null
            )"

          else

            LIST="$(
              xcodebuild \
                -project "${{ steps.xcode.outputs.path }}" \
                -list 2>/dev/null
            )"

          fi

          echo "$LIST"

          SCHEME=""

          # Ưu tiên scheme của project hiện tại
          for NAME in \
            ThreeOneOSFive \
            ShinnCheat \
            ShinnCheatApp
          do

            if echo "$LIST" | grep -Fxq "    $NAME"; then
              SCHEME="$NAME"
              break
            fi

          done

          # Nếu không tìm thấy thì lấy scheme đầu tiên
          if [ -z "$SCHEME" ]; then

            SCHEME="$(
              echo "$LIST" |
              awk '
                /^Schemes:/ {
                  found=1
                  next
                }

                found && /^[[:space:]]+[A-Za-z0-9_.-]+$/ {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  print
                  exit
                }
              '
            )"

          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "SELECTED SCHEME"
          echo "========================================"
          echo "$SCHEME"


      # =========================================================
      # 8. PREPARE BUILD DIRECTORY
      # =========================================================

      - name: Prepare build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p build

          echo "Build directory ready."


      # =========================================================
      # 9. BUILD ARCHIVE
      # =========================================================

      - name: Build archive
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD ARCHIVE"
          echo "========================================"

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/ShinnCheat.xcarchive"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              2>&1 |
              tee "$GITHUB_WORKSPACE/build.log"

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              2>&1 |
              tee "$GITHUB_WORKSPACE/build.log"

          fi


      # =========================================================
      # 10. CHECK ARCHIVE
      # =========================================================

      - name: Check archive
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECK ARCHIVE"
          echo "========================================"

          if [ ! -d "build/ShinnCheat.xcarchive" ]; then

            echo "::error::Archive was not created."

            echo ""
            echo "Build log:"
            cat build.log || true

            exit 1

          fi

          echo "Archive created successfully."

          find \
            build/ShinnCheat.xcarchive/Products \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            -print


      # =========================================================
      # 11. FIND APP
      # =========================================================

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FIND BUILT APP"
          echo "========================================"

          APP="$(
            find \
              build/ShinnCheat.xcarchive/Products/Applications \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print |
            head -n 1
          )"

          if [ -z "$APP" ]; then

            echo "::error::No .app found."

            find \
              build/ShinnCheat.xcarchive \
              -maxdepth 7 \
              -print

            exit 1

          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"

          echo "APP:"
          echo "$APP"


      # =========================================================
      # 12. APP INFORMATION
      # =========================================================

      - name: Show app information
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app }}"

          echo "========================================"
          echo "APP INFORMATION"
          echo "========================================"

          echo ""
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist" || true

          echo ""
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist" || true

          echo ""
          echo "Build:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist" || true


      # =========================================================
      # 13. CREATE PAYLOAD
      # =========================================================

      - name: Create Payload
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CREATE PAYLOAD"
          echo "========================================"

          rm -rf ipa

          mkdir -p ipa/Payload

          cp -R \
            "${{ steps.app.outputs.app }}" \
            ipa/Payload/

          echo "Payload created."


      # =========================================================
      # 14. CREATE IPA
      # =========================================================

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CREATE IPA"
          echo "========================================"

          cd ipa

          zip -qry \
            "$GITHUB_WORKSPACE/ShinnCheat-unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          if [ ! -f "ShinnCheat-unsigned.ipa" ]; then
            echo "::error::IPA was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh ShinnCheat-unsigned.ipa


      # =========================================================
      # 15. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat-unsigned.ipa
          if-no-files-found: error


      # =========================================================
      # 16. UPLOAD XCARCHIVE
      # =========================================================

      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-XCArchive
          path: build/ShinnCheat.xcarchive
          if-no-files-found: error


      # =========================================================
      # 17. UPLOAD BUILD LOG
      # =========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: build.log
          if-no-files-found: ignore