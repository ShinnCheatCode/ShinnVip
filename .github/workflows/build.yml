
name: Build IPA from Source.zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Source.zip
        run: |
          test -f Source.zip || {
            echo "ERROR: Khong tim thay Source.zip"
            exit 1
          }

      - name: Extract ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          ditto -x -k Source.zip "$RUNNER_TEMP/source"

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          PROJECT=$(find "$RUNNER_TEMP/source" \
            -name '*.xcodeproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Khong tim thay xcodeproj trong Source.zip"
            find "$RUNNER_TEMP/source" -name '*.xcworkspace'
            exit 1
          fi

          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          xcodebuild -list -project "$PROJECT"

      - name: Build IPA
        env:
          PROJECT: ${{ steps.project.outputs.path }}
        run: |
          SCHEME=$(xcodebuild -list -json \
            -project "$PROJECT" |
            python3 -c '
import json,sys
d=json.load(sys.stdin)
print(d["project"]["schemes"][0])
')

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          APP=$(find \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications" \
            -maxdepth 1 -name '*.app' -print -quit)

          test -n "$APP" || {
            echo "Khong tim thay app sau khi build"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/KaitoCheat.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KaitoCheat-IPA
          path: KaitoCheat.ipa
