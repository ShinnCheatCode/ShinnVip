      - name: Make IPA
        run: |
          set -e
          # Tìm Runner.app ở nhiều vị trí
          APP=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            APP=$(find /Users/runner/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos*" -name "Runner.app" -type d 2>/dev/null | head -1)
          fi
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "=== Debug: looking for .app ==="
            find build -type d -name "*.app" 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -20 || true
            ls -la build/ 2>/dev/null || true
            exit 1
          fi
          rm -rf Payload ShinnManager.ipa
          mkdir Payload
          cp -R "$APP" Payload/ShinnManager.app
          ditto -c -k --sequesterRsrc --keepParent Payload ShinnManager.ipa
          ls -lh ShinnManager.ipa
          shasum -a 256 ShinnManager.ipa