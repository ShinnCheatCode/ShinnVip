struct RepositoryManagerView: View {
    @StateObject private var manager = OwnerKeyManager()
    @State private var repoURL = ""
    @State private var repoName = ""
    @State private var selectedKey = ""
    @State private var locked = false
    @State private var status = ""

    var body: some View {
        ScrollView {
            VStack(alignment: .leading, spacing: 14) {
                Text("REPOSITORY MANAGER").font(.title.bold())
                Text("Assign a JSON repo URL to a key. Lock blocks packages.")
                    .font(.caption)
                    .foregroundStyle(.secondary)

                TextField("Repo name (VIP 1)", text: $repoName)
                    .padding(12)
                    .background(Color.primary.opacity(0.08), in: RoundedRectangle(cornerRadius: 12, style: .continuous))

                TextField("https://.../shinn.json", text: $repoURL)
                    .textInputAutocapitalization(.never)
                    .keyboardType(.URL)
                    .padding(12)
                    .background(Color.primary.opacity(0.08), in: RoundedRectangle(cornerRadius: 12, style: .continuous))

                Toggle("Lock repo for this key", isOn: $locked)

                Button("Save to selected key") {
                    Task { await save() }
                }
                .buttonStyle(.borderedProminent)
                .disabled(selectedKey.isEmpty)

                if !status.isEmpty {
                    Text(status).font(.footnote)
                }

                ForEach(manager.keys) { row in
                    Button {
                        selectedKey = row.key
                    } label: {
                        VStack(alignment: .leading, spacing: 4) {
                            Text(row.key).font(.headline)
                            Text("\((row.label ?? "").isEmpty ? (row.role ?? "member") : row.label!) â¢ \(selectedKey == row.key ? "selected" : "")")
                                .font(.caption2)
                                .foregroundStyle(.secondary)
                        }
                        .frame(maxWidth: .infinity, alignment: .leading)
                        .padding(12)
                        .shinnGlass()
                    }
                    .buttonStyle(.plain)
                }
            }
            .padding()
        }
        .navigationTitle("Repos")
        .task { await manager.listKeys() }
    }

    func save() async {
        status = "Savingâ¦"
        do {
            var request = URLRequest(url: SupabaseConfig.projectURL.appendingPathComponent("/rest/v1/rpc/add_key_repo"))
            request.httpMethod = "POST"
            request.setValue("application/json", forHTTPHeaderField: "Content-Type")
            request.setValue(SupabaseConfig.anonKey, forHTTPHeaderField: "apikey")
            request.setValue("Bearer \(SupabaseConfig.anonKey)", forHTTPHeaderField: "Authorization")
            let actorKey = UserDefaults.standard.string(forKey: "shinn.license.key")?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
            let actorRole = UserDefaults.standard.string(forKey: "shinn.license.role")?.lowercased() ?? ""
            guard !actorKey.isEmpty, !actorRole.isEmpty else {
                status = "Missing active Owner/Admin key"
                return
            }
            request.httpBody = try JSONSerialization.data(withJSONObject: [
                "p_key": selectedKey,
                "p_repo_url": repoURL.trimmingCharacters(in: .whitespacesAndNewlines),
                "p_locked": locked,
                "p_actor_key": actorKey,
                "p_actor_role": actorRole,
                "p_repo_name": repoName.trimmingCharacters(in: .whitespacesAndNewlines)
            ])
            let (data, response) = try await URLSession.shared.data(for: request)
            guard let http = response as? HTTPURLResponse, 200...299 ~= http.statusCode else {
                status = String(decoding: data, as: UTF8.self)
                return
            }
            status = "Saved"
            await manager.listKeys()
        } catch {
            status = "Failed"
        }
    }
}

