name: Build ShinnManger IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check ZIP
        run: |
          set -euo pipefail
          ls -lah
          test -f ShinnManger.zip

      - name: Extract source
        run: |
          set -euo pipefail

          rm -rf build_source
          mkdir -p build_source

          unzip -q ShinnManger.zip -d build_source

          echo "===== Extracted files ====="
          find build_source -maxdepth 3 -type f | sort | head -200

      - name: Detect Flutter project
        run: |
          set -euo pipefail

          PROJECT=$(find build_source -name pubspec.yaml -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Không tìm thấy pubspec.yaml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos || true

      - name: Create iOS project if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d ios ]; then
            echo "ios/ chưa tồn tại - tạo iOS project"

            flutter create \
              --platforms=ios \
              --org com.shinn \
              --project-name shinnmanager \
              .

          else
            echo "Đã có ios/, giữ nguyên."
          fi

      - name: Set minimum iOS version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '.*'/platform :ios, '17.0'/" ios/Podfile || true

            if ! grep -q "platform :ios" ios/Podfile; then
              sed -i '' "1i\\
platform :ios, '17.0'
" ios/Podfile
            fi
          fi

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter pub get again
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign

      - name: Package IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          rm -rf Payload
          mkdir -p Payload

          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" -type d -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Không tìm thấy .app"
            find build/ios -maxdepth 4 -print
            exit 1
          fi

          echo "APP=$APP"

          cp -R "$APP" Payload/

          zip -qry ../ShinnManger.ipa Payload

      - name: SHA256
        run: |
          shasum -a 256 ShinnManger.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnManger-IPA
          path: ShinnManger.ipa
          if-no-files-found: error