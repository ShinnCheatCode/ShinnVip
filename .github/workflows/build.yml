name: Build IPA from Source.zip

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      - name: TEST - workflow is running
        run: |
          echo "========================================"
          echo "SHINNCHEAT BUILD WORKFLOW IS RUNNING"
          echo "========================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_NAME"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Source.zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Files in repository:"
          find . -maxdepth 3 -type f -print | sort | head -300

          if [ ! -f "Source.zip" ]; then
            echo "::error::Source.zip was not found in the repository ROOT."
            exit 1
          fi

          echo "Source.zip found:"
          ls -lh Source.zip

      - name: Extract Source.zip
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q Source.zip -d source

          echo "Xcode projects found:"

          find source \
            -type d \
            \( \
              -name "*.xcodeproj" \
              -o -name "*.xcworkspace" \
            \) \
            -print

      - name: Find Xcode project
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name "*.xcworkspace" \
              -not -path "*/Pods/*" \
              -print |
            head -n 1
          )"

          PROJECT="$(
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name "*.xcodeproj" \
              -not -path "*/Pods/*" \
              -print |
            head -n 1
          )"

          if [ -n "$WORKSPACE" ]; then

            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"

            echo "Workspace:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

            echo "Project:"
            echo "$PROJECT"

          else

            echo "::error::No .xcodeproj or .xcworkspace found."

            find source -maxdepth 8 -print

            exit 1

          fi

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AVAILABLE SCHEMES"
          echo "========================================"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -list

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -list

          fi

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            LIST="$(
              xcodebuild \
                -workspace "${{ steps.xcode.outputs.path }}" \
                -list 2>/dev/null
            )"

          else

            LIST="$(
              xcodebuild \
                -project "${{ steps.xcode.outputs.path }}" \
                -list 2>/dev/null
            )"

          fi

          echo "$LIST"

          SCHEME=""

          for NAME in \
            ThreeOneOSFive \
            ShinnCheat \
            ShinnCheatApp
          do

            if echo "$LIST" | grep -Fxq "    $NAME"; then
              SCHEME="$NAME"
              break
            fi

          done

          if [ -z "$SCHEME" ]; then

            SCHEME="$(
              echo "$LIST" |
              awk '
                /^Schemes:/ {
                  found=1
                  next
                }

                found && /^[[:space:]]+[A-Za-z0-9_.-]+$/ {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  print
                  exit
                }
              '
            )"

          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Selected scheme:"
          echo "$SCHEME"

      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build

          ARCHIVE="$GITHUB_WORKSPACE/build/ShinnCheat.xcarchive"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              2>&1 |
              tee "$GITHUB_WORKSPACE/build.log"

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              2>&1 |
              tee "$GITHUB_WORKSPACE/build.log"

          fi

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find \
              build/ShinnCheat.xcarchive/Products/Applications \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print |
            head -n 1
          )"

          if [ -z "$APP" ]; then

            echo "::error::No .app found in archive."

            find \
              build/ShinnCheat.xcarchive \
              -maxdepth 7 \
              -print

            exit 1

          fi

          rm -rf ipa

          mkdir -p ipa/Payload

          cp -R "$APP" ipa/Payload/

          cd ipa

          zip -qry \
            "$GITHUB_WORKSPACE/ShinnCheat-unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh ShinnCheat-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: build.log
          if-no-files-found: ignore