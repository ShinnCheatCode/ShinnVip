name: Build IPA from Source.zip

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "Source.zip"
      - ".github/workflows/build.yml"

concurrency:
  group: build-ipa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # BUILD INFORMATION
      # ============================================================

      - name: Show build information
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        BUILD INFORMATION"
          echo "========================================"

          echo "Repository:"
          git remote get-url origin || true

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Commit message:"
          git log -1 --pretty=%B

          echo ""
          echo "Branch:"
          git branch --show-current || true

      # ============================================================
      # CHECK SOURCE.ZIP
      # ============================================================

      - name: Check Source.zip
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CHECK Source.zip"
          echo "========================================"

          if [ ! -f "Source.zip" ]; then
            echo "❌ Không tìm thấy Source.zip"

            echo ""
            echo "Các file hiện có:"
            find . -maxdepth 4 -type f -print

            exit 1
          fi

          echo "✅ Tìm thấy Source.zip"

          ls -lh Source.zip

          echo ""
          echo "SHA256 Source.zip:"
          shasum -a 256 Source.zip

          echo ""
          echo "File type:"
          file Source.zip

      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract Source.zip
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        EXTRACT SOURCE"
          echo "========================================"

          rm -rf source
          mkdir -p source

          unzip -q Source.zip -d source

          echo "✅ Giải nén thành công"

          echo ""
          echo "Source files:"
          find source -maxdepth 6 -type f | sort | head -500

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        VERIFY SOURCE"
          echo "========================================"

          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Source.zip SHA256:"
          shasum -a 256 Source.zip

          # --------------------------------------------------------
          # YunaSpeech
          # --------------------------------------------------------

          echo ""
          echo "Checking YunaSpeech.swift..."

          YUNA_FILES=$(
            find source \
              -type f \
              -name "YunaSpeech.swift" \
              -print
          )

          if [ -z "$YUNA_FILES" ]; then
            echo "❌ Không tìm thấy YunaSpeech.swift"
            exit 1
          fi

          echo "$YUNA_FILES"

          echo "✅ YunaSpeech.swift tồn tại."

          # --------------------------------------------------------
          # Old telegramURL
          # --------------------------------------------------------

          echo ""
          echo "Checking old telegramURL..."

          if grep -RIn \
            --include="*.swift" \
            "telegramURL" \
            source 2>/dev/null; then

            echo ""
            echo "❌ Source vẫn còn telegramURL."
            echo "❌ Kiểm tra lại Source.zip."

            exit 1
          fi

          echo "✅ Không còn telegramURL trong Swift."

          # --------------------------------------------------------
          # Unsafe URL force unwrap
          # --------------------------------------------------------

          echo ""
          echo "Checking URL(string:) force unwrap..."

          if grep -RIn \
            --include="*.swift" \
            'URL(string:.*)!' \
            source 2>/dev/null; then

            echo ""
            echo "⚠️ Phát hiện URL(string:)! trong Swift."
            echo "Kiểm tra các dòng trên."
          else
            echo "✅ Không phát hiện URL(string:)!."
          fi

      # ============================================================
      # FIND XCODE PROJECT
      # ============================================================

      - name: Find Xcode project
        id: xcode
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        FIND XCODE PROJECT"
          echo "========================================"

          WORKSPACE=$(find source \
            -type d \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)

          PROJECT=$(find source \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -print -quit)

          if [ -n "$WORKSPACE" ]; then

            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"

            echo "✅ Workspace:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "workspace=" >> "$GITHUB_OUTPUT"
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

            echo "✅ Project:"
            echo "$PROJECT"

          else

            echo "❌ Không tìm thấy Xcode project."

            find source -maxdepth 8 -print

            exit 1

          fi

      # ============================================================
      # XCODE INFORMATION
      # ============================================================

      - name: Xcode information
        shell: bash
        run: |
          echo "========================================"
          echo "        XCODE INFORMATION"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Xcode path:"
          xcode-select -p

          echo ""
          echo "macOS:"
          sw_vers

      # ============================================================
      # LIST PROJECT / SCHEMES
      # ============================================================

      - name: List schemes
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "        AVAILABLE SCHEMES"
          echo "========================================"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -list

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -list

          fi

      # ============================================================
      # DETECT VALID SCHEME
      # ============================================================

      - name: Detect valid scheme
        id: scheme
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        DETECT VALID SCHEME"
          echo "========================================"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            LIST_OUTPUT=$(
              xcodebuild \
                -workspace "${{ steps.xcode.outputs.workspace }}" \
                -list
            )

          else

            LIST_OUTPUT=$(
              xcodebuild \
                -project "${{ steps.xcode.outputs.project }}" \
                -list
            )

          fi

          echo ""
          echo "Full Xcode list:"
          echo "$LIST_OUTPUT"

          echo ""
          echo "========================================"
          echo "        AVAILABLE SCHEMES"
          echo "========================================"

          echo "$LIST_OUTPUT" |
            sed -n '/Schemes:/,$p'

          # --------------------------------------------------------
          # Extract scheme
          # --------------------------------------------------------

          SCHEME=$(
            echo "$LIST_OUTPUT" |
            awk '
              /^Schemes:/ {
                getline

                gsub(/^[[:space:]]+/, "")
                gsub(/[[:space:]]+$/, "")

                if ($0 != "") {
                  print
                  exit
                }
              }
            '
          )

          # --------------------------------------------------------
          # Fallback: find target
          # --------------------------------------------------------

          if [ -z "$SCHEME" ]; then

            echo ""
            echo "⚠️ Không lấy được Scheme trực tiếp."
            echo "Đang thử lấy Target..."

            TARGET=$(
              echo "$LIST_OUTPUT" |
              awk '
                /^Targets:/ {
                  getline

                  gsub(/^[[:space:]]+/, "")
                  gsub(/[[:space:]]+$/, "")

                  if ($0 != "") {
                    print
                    exit
                  }
                }
              '
            )

            if [ -n "$TARGET" ]; then
              SCHEME="$TARGET"
            fi

          fi

          # --------------------------------------------------------
          # Final check
          # --------------------------------------------------------

          if [ -z "$SCHEME" ]; then

            echo ""
            echo "❌ Không tìm thấy Scheme."

            echo ""
            echo "Xcode output:"
            echo "$LIST_OUTPUT"

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "        SELECTED SCHEME"
          echo "========================================"

          echo "Scheme: [$SCHEME]"

          echo ""
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo "✅ Scheme hợp lệ."

      # ============================================================
      # VERIFY SCHEME
      # ============================================================

      - name: Verify scheme
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        VERIFY SCHEME"
          echo "========================================"

          SCHEME="${{ steps.scheme.outputs.scheme }}"

          echo "Scheme:"
          echo "$SCHEME"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme "$SCHEME" \
              -showBuildSettings \
              > /tmp/build-settings.txt

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -scheme "$SCHEME" \
              -showBuildSettings \
              > /tmp/build-settings.txt

          fi

          echo "✅ Scheme hợp lệ."

          echo ""
          echo "Important build settings:"

          grep -E \
            "TARGET_NAME|PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|INFOPLIST_FILE|SWIFT_VERSION" \
            /tmp/build-settings.txt \
            | head -100 || true

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CLEAN BUILD"
          echo "========================================"

          rm -rf build
          rm -rf ipa

          mkdir -p build

      # ============================================================
      # BUILD ARCHIVE
      # ============================================================

      - name: Build archive
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "        BUILD ARCHIVE"
          echo "========================================"

          SCHEME="${{ steps.scheme.outputs.scheme }}"

          echo "Scheme:"
          echo "$SCHEME"

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$PWD/build/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              | tee build.log

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$PWD/build/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive \
              | tee build.log

          fi

      # ============================================================
      # CHECK ARCHIVE
      # ============================================================

      - name: Check archive
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CHECK ARCHIVE"
          echo "========================================"

          if [ ! -d "build/App.xcarchive" ]; then

            echo "❌ Archive không được tạo."

            echo ""
            cat build.log || true

            exit 1
          fi

          echo "✅ Archive đã được tạo."

          echo ""
          echo "Built applications:"

          find \
            build/App.xcarchive/Products \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            -print

      # ============================================================
      # FIND BUILT APP
      # ============================================================

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        FIND BUILT APP"
          echo "========================================"

          APP=$(
            find \
              build/App.xcarchive/Products/Applications \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print -quit
          )

          if [ -z "$APP" ]; then

            echo "❌ Không tìm thấy .app."

            find \
              build/App.xcarchive \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"

          echo "✅ APP:"
          echo "$APP"

      # ============================================================
      # SHOW APP INFORMATION
      # ============================================================

      - name: Show app information
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        APP INFORMATION"
          echo "========================================"

          APP="${{ steps.app.outputs.app }}"

          echo "Bundle Identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist" || true

          echo ""
          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist" || true

          echo ""
          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist" || true

          echo ""
          echo "Executable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Info.plist" || true

      # ============================================================
      # VERIFY FINAL BINARY
      # ============================================================

      - name: Verify final binary
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        VERIFY FINAL BINARY"
          echo "========================================"

          APP="${{ steps.app.outputs.app }}"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP/Info.plist"
          )

          BINARY="$APP/$EXECUTABLE"

          if [ ! -f "$BINARY" ]; then
            echo "❌ Không tìm thấy executable:"
            echo "$BINARY"
            exit 1
          fi

          echo "Binary:"
          echo "$BINARY"

          echo ""
          echo "Binary SHA256:"
          shasum -a 256 "$BINARY"

          # --------------------------------------------------------
          # Check old crash symbol
          # --------------------------------------------------------

          echo ""
          echo "Checking telegramURL..."

          if strings "$BINARY" |
            grep -E \
            "telegramURL|one-time initialization function for telegramURL"; then

            echo ""
            echo "❌❌❌ PHÁT HIỆN telegramURL TRONG BINARY ❌❌❌"
            echo ""
            echo "Binary vẫn chứa code cũ."
            echo "IPA sẽ KHÔNG được tạo."

            exit 1
          fi

          echo "✅ Không có telegramURL trong binary."

          # --------------------------------------------------------
          # Check Yuna
          # --------------------------------------------------------

          echo ""
          echo "Checking YunaSpeech..."

          if strings "$BINARY" |
            grep -q "YunaSpeech"; then

            echo "✅ YunaSpeech được tìm thấy trong binary."

          else

            echo "⚠️ Không tìm thấy symbol YunaSpeech."

          fi

      # ============================================================
      # VERIFY PRIVACY PERMISSIONS
      # ============================================================

      - name: Verify privacy permissions
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        PRIVACY PERMISSIONS"
          echo "========================================"

          APP="${{ steps.app.outputs.app }}"

          echo "Microphone:"
          /usr/libexec/PlistBuddy \
            -c "Print :NSMicrophoneUsageDescription" \
            "$APP/Info.plist" || true

          echo ""
          echo "Speech Recognition:"
          /usr/libexec/PlistBuddy \
            -c "Print :NSSpeechRecognitionUsageDescription" \
            "$APP/Info.plist" || true

          echo ""
          echo "Face ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :NSFaceIDUsageDescription" \
            "$APP/Info.plist" || true

      # ============================================================
      # CREATE PAYLOAD
      # ============================================================

      - name: Create Payload
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CREATE PAYLOAD"
          echo "========================================"

          rm -rf ipa

          mkdir -p ipa/Payload

          cp -R \
            "${{ steps.app.outputs.app }}" \
            ipa/Payload/

          echo "✅ Payload created."

      # ============================================================
      # CREATE IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CREATE IPA"
          echo "========================================"

          cd ipa

          zip -qry \
            "../ShinnCheat-unsigned.ipa" \
            Payload

          cd ..

          if [ ! -f "ShinnCheat-unsigned.ipa" ]; then

            echo "❌ Không tạo được IPA."

            exit 1
          fi

          echo "✅ IPA CREATED"

          ls -lh \
            ShinnCheat-unsigned.ipa

          echo ""
          echo "IPA SHA256:"

          shasum -a 256 \
            ShinnCheat-unsigned.ipa

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat-unsigned.ipa
          if-no-files-found: error

      # ============================================================
      # UPLOAD XCARCHIVE
      # ============================================================

      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-XCArchive
          path: build/App.xcarchive
          if-no-files-found: error

      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: |
            build.log
            source/**/*.log
          if-no-files-found: ignore

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "        BUILD SUCCESS"
          echo "========================================"

          echo ""
          echo "Source SHA256:"
          shasum -a 256 Source.zip

          echo ""
          echo "IPA SHA256:"
          shasum -a 256 ShinnCheat-unsigned.ipa

          echo ""
          echo "Scheme:"
          echo "${{ steps.scheme.outputs.scheme }}"

          echo ""
          echo "✅ Source verified"
          echo "✅ Scheme verified"
          echo "✅ Binary verified"
          echo "✅ telegramURL not found"
          echo "✅ IPA created successfully"