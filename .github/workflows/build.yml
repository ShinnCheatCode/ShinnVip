name: Build IPA from Source.zip

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: TEST ACTIONS
        run: |
          echo "========================================"
          echo "SHINN CHEAT ACTIONS TEST"
          echo "========================================"
          echo "Workflow is actually running!"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Source.zip
        run: |
          echo "Checking Source.zip..."

          if [ ! -f "Source.zip" ]; then
            echo "ERROR: Source.zip not found"
            echo ""
            echo "Current files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Source.zip FOUND"
          ls -lh Source.zip